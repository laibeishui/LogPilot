<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LogPilot · 日志管理原型</title><style>
:root{--bg:#f5f7fb;--panel:#fff;--ink:#182339;--muted:#66758a;--line:#e7ebf1;--nav:#101d33;--blue:#496ff5;--bluelight:#eaf0ff;--green:#16a376;--red:#e44d5d;--orange:#d99725;--radius:13px}*{box-sizing:border-box}body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}a{color:var(--blue)}.layout{display:grid;grid-template-columns:226px 1fr;min-height:100vh}.nav{background:var(--nav);color:#9fb0cd;position:sticky;top:0;height:100vh;padding:24px 14px}.brand{display:flex;align-items:center;gap:12px;color:white;font-size:21px;font-weight:750;padding:0 12px 28px}.logo{background:linear-gradient(130deg,#597afe,#36b8c9);width:34px;height:34px;display:grid;place-items:center;border-radius:10px;color:white}.navtitle{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#6f84a7;padding:10px 13px}.nav button{display:flex;align-items:center;gap:11px;width:100%;margin:4px 0;border:0;background:transparent;color:#b3c2dc;text-align:left;padding:11px 13px;border-radius:9px}.nav button:hover,.nav button.active{background:#233958;color:#fff}.nav .foot{position:absolute;bottom:18px;left:24px;color:#7087a8;font-size:12px}.main{min-width:0}.top{background:#fff;border-bottom:1px solid var(--line);padding:17px 29px;display:flex;justify-content:space-between;align-items:center}.top .crumb{color:#8c99aa}.top strong{font-weight:700;color:var(--ink)}.topright{display:flex;align-items:center;gap:18px;color:var(--muted)}.avatar{border-radius:50%;background:#eaf0ff;color:var(--blue);width:33px;height:33px;display:grid;place-items:center;font-weight:700}.content{padding:28px 30px;max-width:1550px;margin:auto}.headline{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:23px}.headline h1{font-size:25px;margin:0 0 6px}.headline p{color:var(--muted);margin:0}.muted{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 4px 24px #283e6010}.pad{padding:21px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.kpi{padding:21px}.kpi .val{font-weight:750;font-size:29px;margin:12px 0 5px}.kpi .trend{font-size:12px;color:var(--muted)}.green{color:var(--green)}.red{color:var(--red)}.orange{color:var(--orange)}.two{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;margin-top:18px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px;gap:12px}.sectionhead h3{margin:0;font-size:16px}.btn{border:1px solid #dfe6ee;background:white;color:#34455c;padding:9px 14px;border-radius:8px;white-space:nowrap}.btn:hover{border-color:var(--blue);color:var(--blue)}.primary{background:var(--blue);border-color:var(--blue);color:white}.primary:hover{color:white;background:#355bd7}.danger{border-color:#ffe2e5;color:var(--red)}.filters{display:grid;grid-template-columns:minmax(190px,2fr) repeat(3,minmax(130px,1fr)) auto;gap:12px;margin:18px 0}.field{border:1px solid #dfe5ed;border-radius:8px;padding:10px 12px;background:#fff;min-width:0;width:100%;color:#34445b}.field:focus{outline:2px solid #dae2ff;border-color:var(--blue)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}th{font-weight:650;font-size:12px;color:#8290a3;background:#fafbfd}td,th{padding:14px 17px;border-bottom:1px solid #f0f2f6}tr.clickable:hover{background:#f7f9fe;cursor:pointer}td.msg{min-width:260px;max-width:560px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.tag{display:inline-block;font-size:11px;font-weight:650;padding:3px 8px;border-radius:6px}.error{background:#ffebee;color:#d74652}.warn{background:#fff4dc;color:#b98525}.info{background:#e9f3ff;color:#357abe}.debug{background:#f0eef8;color:#777098}.pill{display:inline-flex;align-items:center;gap:6px;background:#edf8f3;color:#13926a;padding:5px 10px;border-radius:20px;font-size:12px}.pill::before{content:"";width:6px;height:6px;background:currentColor;border-radius:50%}.dot{width:8px;height:8px;border-radius:50%;background:#23ab7c;display:inline-block;margin-right:7px}.progress{height:8px;background:#ecf1f6;border-radius:6px;overflow:hidden}.progress span{display:block;height:100%;background:#6286f8}.legend{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.legend span{font-size:12px;color:var(--muted)}.barchart{height:210px;display:flex;align-items:end;gap:8px;border-bottom:1px solid #e6eaf0;padding:10px 8px 0;background:linear-gradient(#fff,#f9fbff)}.bar{flex:1;background:linear-gradient(180deg,#7895ff,#c1ceff);border-radius:5px 5px 0 0;min-width:8px}.bar.err{background:linear-gradient(180deg,#f27988,#ffc8cf)}.rows{display:grid;gap:13px}.rows .line{display:flex;justify-content:space-between;align-items:center;gap:10px}.empty{padding:55px;text-align:center;color:var(--muted)}.pagination{display:flex;justify-content:space-between;align-items:center;padding:17px}.modalback{position:fixed;inset:0;background:#101e38a6;display:grid;place-items:center;padding:18px;z-index:10}.modal{background:white;border-radius:16px;width:min(680px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 80px #08142955}.modal header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line)}.modal header h2{margin:0;font-size:18px}.modal .inner{padding:24px}.modal footer{display:flex;justify-content:flex-end;gap:10px;padding:17px 24px;border-top:1px solid var(--line)}.close{background:none;border:0;font-size:25px;color:#8591a3}.label{display:block;color:#56657a;margin-bottom:7px;font-size:13px}.formrow{margin-bottom:16px}.code{background:#13213a;color:#d9e7ff;padding:17px;border-radius:9px;overflow:auto;white-space:pre-wrap;word-break:break-word;font:12px/1.7 Consolas,Monaco,monospace}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs .btn.active{color:var(--blue);background:var(--bluelight);border-color:#cbd7ff}.notice{background:#fff8e9;color:#8a6420;border:1px solid #ffe8ba;border-radius:9px;padding:12px 14px;font-size:12px;margin-bottom:18px}.step{display:flex;gap:13px;margin:18px 0}.num{border-radius:50%;width:28px;height:28px;flex:none;display:grid;place-items:center;background:#e9efff;color:var(--blue);font-weight:700}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.small{font-size:12px}.state{background:#eef3ff;color:var(--blue);padding:3px 8px;border-radius:5px;font-size:11px}.toast{position:fixed;bottom:24px;right:25px;background:#192b49;color:#fff;border-radius:10px;padding:13px 18px;z-index:30;box-shadow:0 12px 35px #18233938}pre{white-space:pre-wrap;word-break:break-word}h3{font-size:17px}@media(max-width:1000px){.layout{grid-template-columns:74px 1fr}.nav{padding:20px 9px}.brand{font-size:0;padding-left:10px}.navtitle,.nav .foot,.nav button .txt{display:none}.nav button{justify-content:center;font-size:19px}.filters{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:620px){.layout{grid-template-columns:1fr}.nav{position:static;height:auto;display:flex;align-items:center;padding:7px;overflow:auto}.brand{display:none}.nav button{width:auto;flex:none}.top{padding:12px 16px}.content{padding:18px 12px}.headline h1{font-size:21px}.filters,.grid2,.kpis{grid-template-columns:1fr}.topright .small{display:none}}
</style></head><body><div id="app"><div class="layout"><aside class="nav"><div class="brand"><span class="logo">◈</span>LogPilot</div><div class="navtitle">工作空间</div><button data-nav="overview" class="active"><span>▦</span><span class="txt">总览</span></button><button data-nav="logs"><span>☷</span><span class="txt">日志检索</span></button><button data-nav="projects"><span>▣</span><span class="txt">项目管理</span></button><button data-nav="integrations"><span>⇄</span><span class="txt">接入中心</span></button><div class="navtitle">规划功能</div><button data-nav="alerts"><span>♧</span><span class="txt">告警中心</span></button><button data-nav="settings"><span>⚙</span><span class="txt">系统设置</span></button><div class="foot">交互原型 V0.1 · 离线演示</div></aside><main class="main"><div class="top"><div class="crumb">工作空间 / <strong id="crumb">总览</strong></div><div class="topright"><span class="pill">演示环境</span><span class="small">管理员</span><span class="avatar">A</span></div></div><div class="content" id="page"></div></main></div><div id="modalroot"></div><div id="toastroot"></div></div><script>
(()=>{'use strict';
const now=Date.now(), levels=['Error','Warn','Info','Debug'];let projects=[{id:'hilink',name:'海搭平台',code:'hilink',desc:'业务日志演示',status:'启用'},{id:'shop',name:'演示商城',code:'shop',desc:'模拟项目',status:'启用'}];let logs=[];const services=['hilink-api','hilink-admin-api','gateway-nginx','payment-api','python-worker'];const samples=[['Error','MySQL connection timeout','MySqlException: Connect Timeout expired.'],['Warn','API response took 1820ms','Route=/api/order/create; Duration=1820'],['Info','HTTP request completed','Status=200; Method=GET'],['Error','Unexpected error in payment service','System.TimeoutException: downstream request timed out'],['Debug','Cache entry refreshed','Key=homepage:top'],['Info','Background job completed','Processed=36']];for(let i=0;i<84;i++){let s=samples[i%samples.length];logs.push({id:'evt-'+String(i+1).padStart(5,'0'),project:i%8===0?'shop':'hilink',timestamp:new Date(now-(i*3+1)*60000).toISOString(),level:s[0],service:services[i%services.length],message:s[1],stack:s[2],traceId:(i%4===0?'4bf92f3577b34da6a3ce929d0e0e4736':'abc123_'+i),environment:i%8===0?'staging':'production'})}let state={page:'overview',keyword:'',level:'all',service:'all',range:'24h',project:'all',offset:0,limit:12,integration:'otlp'};const $=id=>document.getElementById(id);const escapeHtml=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const opts=(values,selected)=>values.map(v=>`<option value="${escapeHtml(v)}" ${v===selected?'selected':''}>${escapeHtml(v==='all'?'全部':v)}</option>`).join('');function fmt(v){return new Date(v).toLocaleString('zh-CN',{hour12:false})}function head(t,sub,buttons=''){return `<div class="headline"><div><h1>${t}</h1><p>${sub}</p></div><div>${buttons}</div></div>`}function stat(label,value,sub){return `<div class="card kpi"><div class="muted">${label}</div><div class="val">${value}</div><div class="trend">${sub}</div></div>`}function overview(){let count=logs.length,err=logs.filter(x=>x.level==='Error').length;return head('运行总览','集中管理应用日志，快速定位问题。','<button class="btn primary" data-nav="logs">查看日志 →</button>')+`<div class="notice">这里显示的是交互原型的模拟数据，不代表已经连接 VictoriaLogs 或真实业务服务。</div><div class="kpis">${stat('日志总数',count,'当前演示样本')}${stat('错误日志',err,'演示样本中的 Error')}${stat('活跃项目',projects.filter(x=>x.status==='启用').length,'样例项目')}${stat('接入服务',new Set(logs.map(x=>x.service)).size,'样例服务')}</div><div class="two"><div class="card pad"><div class="sectionhead"><h3>日志趋势（演示）</h3><span class="muted small">最近 12 个时段</span></div><div class="barchart">${[25,38,45,32,42,56,43,68,62,76,61,48].map((v,i)=>`<div class="bar ${i===9?'err':''}" style="height:${v+12}%" title="时段 ${i+1}"></div>`).join('')}</div><div class="muted small" style="margin-top:10px">模拟趋势，仅用于界面布局确认</div></div><div class="card pad"><div class="sectionhead"><h3>接入状态</h3><span class="pill">模拟正常</span></div><div class="rows"><div class="line"><span>LogPilot Server</span><span class="green">● 可用</span></div><div class="line"><span>VictoriaLogs</span><span class="green">● 可用（模拟）</span></div><div class="line"><span>项目 Token</span><span>演示</span></div><hr style="border:0;border-top:1px solid var(--line);width:100%"><div class="line"><span class="muted">主要接入</span><strong>OTLP / HTTP Protobuf</strong></div><button class="btn" data-nav="integrations">查看接入指南 →</button></div></div></div><div class="card pad" style="margin-top:18px"><div class="sectionhead"><h3>最近错误</h3><button class="btn" data-nav="logs">查看全部</button></div>${renderTable(logs.filter(x=>x.level==='Error').slice(0,5),false)}</div>`}
function filtered(){let cutoff=state.range==='15m'?now-15*60000:state.range==='1h'?now-3600000:state.range==='24h'?now-86400000:0;return logs.filter(x=>(state.project==='all'||x.project===state.project)&&(state.level==='all'||x.level===state.level)&&(state.service==='all'||x.service===state.service)&&new Date(x.timestamp).getTime()>=cutoff&&(!state.keyword||[x.message,x.stack,x.traceId,x.service].join(' ').toLowerCase().includes(state.keyword.toLowerCase()))).sort((a,b)=>b.timestamp.localeCompare(a.timestamp))}function renderTable(rows,action=true){return `<div class="tablewrap"><table><thead><tr><th>时间</th><th>级别</th><th>服务</th><th>消息内容</th><th>操作</th></tr></thead><tbody>${rows.map(x=>`<tr class="clickable" data-log="${escapeHtml(x.id)}"><td style="white-space:nowrap">${fmt(x.timestamp)}</td><td><span class="tag ${x.level.toLowerCase()}">${x.level}</span></td><td>${escapeHtml(x.service)}</td><td class="msg" title="${escapeHtml(x.message)}">${escapeHtml(x.message)}</td><td><a href="#" data-log="${escapeHtml(x.id)}">查看详情</a></td></tr>`).join('')||'<tr><td colspan="5"><div class="empty">没有匹配的日志，请更改时间范围或搜索条件。</div></td></tr>'}</tbody></table></div>`}
function logsPage(){let result=filtered(),view=result.slice(state.offset,state.offset+state.limit);return head('日志检索','按时间、级别、服务和关键词查找日志。','<button class="btn" id="reset">重置条件</button>')+`<div class="card pad"><div class="filters"><input id="keyword" class="field" value="${escapeHtml(state.keyword)}" placeholder="搜索关键词、TraceId、异常信息..."/><select id="project" class="field">${opts(['all',...projects.map(x=>x.id)],state.project)}</select><select id="service" class="field">${opts(['all',...services],state.service)}</select><select id="level" class="field">${opts(['all',...levels],state.level)}</select><button class="btn primary" id="search">查询</button></div><div class="sectionhead"><div class="tabs">${[['15m','最近15分钟'],['1h','最近1小时'],['24h','最近24小时'],['all','全部演示']].map(([k,n])=>`<button class="btn ${state.range===k?'active':''}" data-range="${k}">${n}</button>`).join('')}</div><span class="muted small">共 ${result.length} 条匹配记录</span></div>${renderTable(view)}<div class="pagination"><span class="muted small">${result.length?state.offset+1:0}–${Math.min(result.length,state.offset+state.limit)} / ${result.length}</span><div><button class="btn" data-page="prev" ${state.offset===0?'disabled':''}>上一页</button> <button class="btn" data-page="next" ${state.offset+state.limit>=result.length?'disabled':''}>下一页</button></div></div></div>`}function projectsPage(){return head('项目管理','使用项目区分日志数据，并为每个项目分配独立接入凭证。','<button class="btn primary" id="newproject">+ 新建项目</button>')+`<div class="card"><div class="tablewrap"><table><thead><tr><th>项目名称</th><th>项目编码</th><th>说明</th><th>状态</th><th>操作</th></tr></thead><tbody>${projects.map(x=>`<tr><td><strong>${escapeHtml(x.name)}</strong></td><td><code>${escapeHtml(x.code)}</code></td><td>${escapeHtml(x.desc)}</td><td><span class="pill">${x.status}</span></td><td><button class="btn" data-project="${escapeHtml(x.id)}">查看日志</button></td></tr>`).join('')}</tbody></table></div></div><p class="muted small">新建项目仅在此原型的浏览器内存中模拟，不会写入 SQLite。</p>`}
const otlp=`# SDK 主要接入：OpenTelemetry OTLP/HTTP Protobuf\nOTEL_EXPORTER_OTLP_LOGS_ENDPOINT=https://your-logpilot.example/v1/logs\nOTEL_EXPORTER_OTLP_LOGS_PROTOCOL=http/protobuf\n# 还需要在对应语言注册日志 SDK 与批量导出器，并配置 Authorization 请求头\n# 以下仅为配置示意，需按具体 SDK 校验 headers 格式`;const json=`curl -X POST "https://your-logpilot.example/api/v1/ingest/logs" \\\n  -H "Authorization: Bearer YOUR_PROJECT_TOKEN" \\\n  -H "Content-Type: application/json" \\\n  -d '{"logs":[{"timestamp":"2026-10-13T10:00:00Z","serviceName":"demo-api","level":"Error","message":"Database timeout"}]}'`;
function integrations(){return head('接入中心','两种方式：正式项目推荐 SDK，旧系统可使用 HTTP JSON 批量发送。')+`<div class="notice">本页面仅展示接入示例，不会生成真实 Token 或连接后端。请不要在演示页面粘贴真实凭证。</div><div class="card pad"><div class="tabs"><button class="btn ${state.integration==='otlp'?'active':''}" data-integ="otlp">OpenTelemetry SDK（推荐）</button><button class="btn ${state.integration==='json'?'active':''}" data-integ="json">HTTP JSON 批量</button></div><div class="step"><div class="num">1</div><div><strong>创建项目与接入 Token</strong><div class="muted small">正式产品里 Token 应只显示一次，且只授予写入对应项目的权限。</div></div></div><div class="step"><div class="num">2</div><div><strong>${state.integration==='otlp'?'安装对应语言的 OpenTelemetry SDK / Exporter':'使用 HTTP 客户端组合批量日志'}</strong><div class="muted small">${state.integration==='otlp'?'使用 Batch Processor 异步导出，避免业务线程逐条请求。':'建议按批次发送，出现失败时自行控制超时和重试。'}</div></div></div><div class="step"><div class="num">3</div><div style="flex:1;min-width:0"><div class="sectionhead"><strong>复制配置示例</strong><button class="btn" id="copycode">复制</button></div><div class="code" id="snippet">${escapeHtml(state.integration==='otlp'?otlp:json)}</div></div></div><div class="step"><div class="num">4</div><div><strong>验证日志是否写入</strong><div class="muted small">真实环境下确认 API 成功响应后，在日志检索中按项目与时间查看。</div></div></div><button class="btn primary" data-nav="logs">前往日志检索 →</button></div>`}
function alerts(){return head('告警中心','按日志条件触发通知，计划在 V0.3 实现。')+`<div class="card pad"><div class="notice">规划功能：下方是视觉演示，当前不会真正执行规则或发送通知。</div><div class="rows">${[['5分钟错误数超过20条','启用示例'],['服务连续15分钟无日志','草稿示例'],['接口超时集中出现','草稿示例']].map(([a,b])=>`<div class="line" style="padding:12px;border-bottom:1px solid var(--line)"><strong>${a}</strong><span class="state">${b}</span></div>`).join('')}</div></div>`}function settings(){return head('系统设置','当前阶段只展示必要信息，复杂管理功能后续实现。')+`<div class="card pad"><div class="rows"><div class="line"><strong>管理服务</strong><span>ASP.NET Core 8 MVC + Web API</span></div><div class="line"><strong>系统数据库</strong><span>SQLite + Dapper</span></div><div class="line"><strong>日志数据库</strong><span>VictoriaLogs</span></div><div class="line"><strong>容器部署</strong><span>两个容器</span></div><div class="line"><strong>消息队列</strong><span>无需 RabbitMQ / Redis</span></div><div class="line"><strong>默认日志保留</strong><span>建议 7 天（实际服务端配置）</span></div></div></div>`}
const pages={overview,logs:logsPage,projects:projectsPage,integrations,alerts,settings};const titles={overview:'总览',logs:'日志检索',projects:'项目管理',integrations:'接入中心',alerts:'告警中心',settings:'系统设置'};function render(){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===state.page));$('crumb').textContent=titles[state.page];$('page').innerHTML=pages[state.page]()}function go(s){state.page=s;state.offset=0;render();scrollTo(0,0)}function modal(html){$('modalroot').innerHTML=`<div class="modalback"><div class="modal">${html}</div></div>`}function close(){ $('modalroot').innerHTML='' }function showLog(id){let x=logs.find(x=>x.id===id);if(!x)return;modal(`<header><h2>日志详情 · ${escapeHtml(x.id)}</h2><button class="close" data-close>×</button></header><div class="inner"><div class="grid2"><div><span class="label">时间</span>${fmt(x.timestamp)}</div><div><span class="label">级别</span><span class="tag ${x.level.toLowerCase()}">${x.level}</span></div><div><span class="label">项目</span>${escapeHtml(x.project)}</div><div><span class="label">服务</span>${escapeHtml(x.service)}</div></div><div style="margin-top:18px"><span class="label">日志消息</span><strong>${escapeHtml(x.message)}</strong></div><div style="margin-top:18px"><span class="label">TraceId</span><code>${escapeHtml(x.traceId)}</code></div><div style="margin-top:18px"><span class="label">异常堆栈或补充字段</span><div class="code">${escapeHtml(x.stack)}</div></div><div style="margin-top:18px"><span class="label">原始 JSON</span><div class="code">${escapeHtml(JSON.stringify(x,null,2))}</div></div></div><footer><button class="btn" data-close>关闭</button><button class="btn primary" data-copylog="${escapeHtml(x.id)}">复制 JSON</button></footer>`)}function newProject(){modal(`<header><h2>新建项目（演示）</h2><button class="close" data-close>×</button></header><div class="inner"><div class="formrow"><label class="label">项目名称</label><input id="pn" class="field" maxlength="40" placeholder="例如：内容管理系统"></div><div class="formrow"><label class="label">项目编码（字母、数字、短横线）</label><input id="pc" class="field" maxlength="30" placeholder="cms-api"></div><div class="formrow"><label class="label">说明</label><input id="pd" class="field" maxlength="100" placeholder="可选"></div><p class="muted small">仅保存在原型页面的临时状态，刷新浏览器后会消失。</p></div><footer><button class="btn" data-close>取消</button><button class="btn primary" id="saveproject">创建演示项目</button></footer>`)}let toastTimer;function toast(s){$('toastroot').innerHTML=`<div class="toast">${escapeHtml(s)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toastroot').innerHTML='',2600)}function copy(s){if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(s).then(()=>toast('已复制到剪贴板')).catch(()=>fallbackCopy(s));else fallbackCopy(s)}function fallbackCopy(s){let el=document.createElement('textarea');el.value=s;document.body.appendChild(el);el.select();try{document.execCommand('copy');toast('已复制到剪贴板')}catch{toast('浏览器限制复制，请手动选择文本')}el.remove()}
document.addEventListener('click',e=>{let t=e.target.closest('button,a,[data-log]');if(!t)return;if(t.tagName==='A')e.preventDefault();if(t.dataset.close!==undefined){close();return}if(t.dataset.nav){go(t.dataset.nav);return}if(t.dataset.log){showLog(t.dataset.log);return}if(t.dataset.range){state.range=t.dataset.range;state.offset=0;render();return}if(t.dataset.page){state.offset=Math.max(0,state.offset+(t.dataset.page==='next'?state.limit:-state.limit));render();return}if(t.id==='search'){state.keyword=$('keyword').value;state.project=$('project').value;state.service=$('service').value;state.level=$('level').value;state.offset=0;render();return}if(t.id==='reset'){Object.assign(state,{keyword:'',project:'all',service:'all',level:'all',range:'24h',offset:0});render();return}if(t.id==='newproject'){newProject();return}if(t.id==='saveproject'){let name=$('pn').value.trim(),code=$('pc').value.trim().toLowerCase();if(!name||!/^[a-z0-9-]{2,30}$/.test(code)){toast('请输入名称和合法项目编码');return}if(projects.some(x=>x.code===code)){toast('项目编码已存在');return}projects.push({id:code,name,code,desc:$('pd').value.trim(),status:'启用'});close();render();toast('演示项目已创建');return}if(t.dataset.project){state.project=t.dataset.project;go('logs');return}if(t.dataset.integ){state.integration=t.dataset.integ;render();return}if(t.id==='copycode'){copy(state.integration==='otlp'?otlp:json);return}if(t.dataset.copylog){let x=logs.find(x=>x.id===t.dataset.copylog);copy(JSON.stringify(x,null,2));return}});document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Enter'&&e.target.id==='keyword')$('search').click()});render();
})();
</script></body></html>
